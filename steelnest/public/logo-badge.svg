<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 300" width="280" height="300">
  <!-- SteelNest Badge Lockup: Hexagonal emblem with icon + brand name -->
  <defs>
    <linearGradient id="steelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2D3436;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#636E72;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="copperGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#C9A96E;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#B8953E;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="badgeBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FAFBFB;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F0F2F2;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Outer badge hexagon (solid, light) -->
  <polygon points="140,12 256,75 256,195 140,258 24,195 24,75"
           fill="url(#badgeBg)" stroke="#636E72" stroke-width="1.5"
           stroke-linejoin="round" />

  <!-- Inner decorative hexagon -->
  <polygon points="140,28 244,85 244,185 140,242 36,185 36,85"
           fill="none" stroke="url(#copperGrad)" stroke-width="1"
           stroke-linejoin="round" stroke-dasharray="4 6" opacity="0.6" />

  <!-- Icon mark (centered in upper portion) -->
  <g transform="translate(40, 55) scale(1.0)">
    <!-- Outer nest hexagon -->
    <polygon points="100,20 170,60 170,120 100,160 30,120 30,60"
             fill="none" stroke="url(#steelGrad)" stroke-width="3.5"
             stroke-linejoin="round" />
    <!-- Woven lines -->
    <line x1="30" y1="60" x2="170" y2="120" stroke="url(#steelGrad)" stroke-width="2.2" opacity="0.6"/>
    <line x1="170" y1="60" x2="30" y2="120" stroke="url(#steelGrad)" stroke-width="2.2" opacity="0.6"/>
    <line x1="100" y1="20" x2="100" y2="160" stroke="url(#steelGrad)" stroke-width="2.2" opacity="0.6"/>
    <line x1="30" y1="60" x2="100" y2="160" stroke="url(#steelGrad)" stroke-width="1.8" opacity="0.4"/>
    <line x1="170" y1="60" x2="100" y2="160" stroke="url(#steelGrad)" stroke-width="1.8" opacity="0.4"/>
    <line x1="30" y1="120" x2="100" y2="20" stroke="url(#steelGrad)" stroke-width="1.8" opacity="0.4"/>
    <line x1="170" y1="120" x2="100" y2="20" stroke="url(#steelGrad)" stroke-width="1.8" opacity="0.4"/>
    <!-- Leaf -->
    <path d="M100,90 C95,75 80,65 85,50 C90,65 100,72 100,90"
          fill="#4A7C59" opacity="0.85" />
    <path d="M100,90 C105,75 120,65 115,50 C110,65 100,72 100,90"
          fill="#5B8C6A" opacity="0.85" />
    <line x1="100" y1="90" x2="100" y2="55" stroke="#3D6B4A" stroke-width="1" opacity="0.7"/>
    <!-- Copper dot -->
    <circle cx="100" cy="90" r="2.8" fill="url(#copperGrad)" />
  </g>

  <!-- Brand name (below icon, inside badge) -->
  <text x="140" y="250" text-anchor="middle"
        font-family="'Playfair Display', Georgia, 'Times New Roman', serif"
        font-size="24" font-weight="700" fill="#2D3436" letter-spacing="2">SteelNest</text>

  <!-- Copper accent line under name -->
  <rect x="90" y="262" width="100" height="2" rx="1" fill="url(#copperGrad)" />

  <!-- Outer ring text: tagline curved (approximated as straight for simplicity) -->
  <text x="140" y="288" text-anchor="middle"
        font-family="'Inter', 'Helvetica Neue', Arial, sans-serif"
        font-size="9" font-weight="600" fill="#636E72" letter-spacing="3">STEEL OVER WOOD</text>
</svg>
