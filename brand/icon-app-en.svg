<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- SteelNest App Icon — English -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2D3436;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a1f20;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="copperGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#C9A96E;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#B8953E;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="steelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#636E72;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4a5558;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background rounded square -->
  <rect x="0" y="0" width="512" height="512" rx="96" ry="96" fill="url(#bgGrad)" />

  <!-- Subtle hexagonal pattern in background -->
  <g opacity="0.06">
    <polygon points="256,40 380,112 380,256 256,328 132,256 132,112" fill="none" stroke="#C9A96E" stroke-width="2"/>
    <polygon points="256,80 350,134 350,242 256,296 162,242 162,134" fill="none" stroke="#C9A96E" stroke-width="1.5"/>
    <polygon points="256,120 320,157 320,228 256,264 192,228 192,157" fill="none" stroke="#C9A96E" stroke-width="1"/>
  </g>

  <!-- Nest Icon (centered, large) -->
  <g transform="translate(156, 90) scale(1.0)">
    <!-- Outer hexagon -->
    <polygon points="100,20 170,60 170,120 100,160 30,120 30,60"
             fill="none" stroke="url(#copperGrad)" stroke-width="3.5"
             stroke-linejoin="round" />
    <!-- Woven lines -->
    <line x1="30" y1="60" x2="170" y2="120" stroke="#636E72" stroke-width="2.2" opacity="0.5"/>
    <line x1="170" y1="60" x2="30" y2="120" stroke="#636E72" stroke-width="2.2" opacity="0.5"/>
    <line x1="100" y1="20" x2="100" y2="160" stroke="#636E72" stroke-width="2.2" opacity="0.5"/>
    <line x1="30" y1="60" x2="100" y2="160" stroke="#636E72" stroke-width="1.8" opacity="0.35"/>
    <line x1="170" y1="60" x2="100" y2="160" stroke="#636E72" stroke-width="1.8" opacity="0.35"/>
    <line x1="30" y1="120" x2="100" y2="20" stroke="#636E72" stroke-width="1.8" opacity="0.35"/>
    <line x1="170" y1="120" x2="100" y2="20" stroke="#636E72" stroke-width="1.8" opacity="0.35"/>
    <!-- Leaf -->
    <path d="M100,90 C95,75 80,65 85,50 C90,65 100,72 100,90"
          fill="#4A7C59" opacity="0.9" />
    <path d="M100,90 C105,75 120,65 115,50 C110,65 100,72 100,90"
          fill="#5B8C6A" opacity="0.9" />
    <line x1="100" y1="90" x2="100" y2="55" stroke="#3D6B4A" stroke-width="1" opacity="0.7"/>
    <!-- Copper center dot -->
    <circle cx="100" cy="90" r="3" fill="url(#copperGrad)" />
  </g>

  <!-- Brand name: SteelNest -->
  <text x="256" y="320" text-anchor="middle"
        font-family="'Playfair Display', Georgia, 'Times New Roman', serif"
        font-size="48" font-weight="700" fill="#FAFBFB" letter-spacing="3">SteelNest</text>

  <!-- Copper accent line -->
  <rect x="156" y="340" width="200" height="3" rx="1.5" fill="url(#copperGrad)" />

  <!-- Tagline -->
  <text x="256" y="380" text-anchor="middle"
        font-family="'Inter', 'Helvetica Neue', Arial, sans-serif"
        font-size="18" font-weight="500" fill="#636E72" letter-spacing="6">STEEL OVER WOOD</text>
</svg>
